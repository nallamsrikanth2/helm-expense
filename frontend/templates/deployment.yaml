apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    name: frontend
    tier: web
spec:
  replicas: {{ .Values.Deployment.replicas }}
  selector:
    matchLabels:
      name: frontend
      tier: web
  template:
    metadata:
      labels:
        name: frontend
        tier: web
    spec:
      containers:
      - name: nginx
        image: devopsrikanth/frontend:v1.0
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
      volumes:
      - name: nginx-conf
        configMap:
          name: frontend
          items:
          - key: nginx.conf
            path: nginx.conf
  
      
  