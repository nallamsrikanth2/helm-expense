apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx
  labels:
    name: nginx
    tier: app
spec:
  replicas: {{ .Values.Deployment.replicas }}
  selector:
    matchLabels:
      name: nginx
      tier: app
  template:
    metadata:
      labels:
        name: nginx
        tier: app
    spec:
      containers:
      - name: nginx
        image: nginx:{{ .Values.Deployment.imageversion }}


